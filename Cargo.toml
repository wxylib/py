[package]
name = "wxy-py"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "_wxy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
# Pinned to a wxylib/core commit so the bindings move only when we say so.
wxy-domain = { git = "https://github.com/wxylib/core", rev = "e9b63c00c8cce3c6e8a445ec3911781d27738929" }
wxy-source = { git = "https://github.com/wxylib/core", rev = "e9b63c00c8cce3c6e8a445ec3911781d27738929" }
wxy-warp = { git = "https://github.com/wxylib/core", rev = "e9b63c00c8cce3c6e8a445ec3911781d27738929" }
async-trait = "0.1.89"
futures = { version = "0.3.31", default-features = false, features = ["executor"] }

[profile.release]
lto = true
codegen-units = 1
