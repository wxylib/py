[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "wxy"
version = "0.0.0"
description = "Python bindings for wxylib (spike)"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest"]
figure = ["matplotlib"]

[tool.maturin]
python-source = "python"
module-name = "wxy._wxy"
features = ["pyo3/extension-module"]
